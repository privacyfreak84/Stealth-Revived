# Project-wide Gradle settings.
# kapt on JDK 16+ needs --add-exports/--add-opens (KT-45545).
org.gradle.jvmargs=-Xmx4g -Xss4m -XX:+UseParallelGC --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.enableJetifier=true
# Upstream code reads framework and library resources through the app R class.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
kotlin.code.style=official
# Moshi 1.15.2 codegen crashes under KSP2 (reads @JsonClass defaults via proxy).
ksp.useKSP2=false
